name: Build & Release Android APK

# Signed release APK on every push to main (artifact), every v* tag and every
# published release (attached directly to the GitHub Release).
# The APK is signed with the keystore stored in repo secrets:
#   NINJA_KEYSTORE_BASE64 / NINJA_STORE_PASSWORD / NINJA_KEY_ALIAS / NINJA_KEY_PASSWORD
# versionName/versionCode are auto-synced from package.json (see android/app/build.gradle).

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  release:
    types: [ published ]
  workflow_dispatch:

concurrency:
  group: ninja-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      NINJA_KEYSTORE_BASE64: ${{ secrets.NINJA_KEYSTORE_BASE64 }}
      NINJA_STORE_PASSWORD: ${{ secrets.NINJA_STORE_PASSWORD }}
      NINJA_KEY_ALIAS: ${{ secrets.NINJA_KEY_ALIAS }}
      NINJA_KEY_PASSWORD: ${{ secrets.NINJA_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure release signing
        if: env.NINJA_KEYSTORE_BASE64 != ''
        run: printf '%s' "$NINJA_KEYSTORE_BASE64" | base64 --decode > android/app/ninja.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK with version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/NINJA-v${VERSION}.apk"
          echo "APK_VERSION=${VERSION}" >> "$GITHUB_ENV"
          ls -la out/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NINJA-v${{ env.APK_VERSION }}-apk
          path: out/NINJA-*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then TAG="${{ github.ref_name }}"; fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --generate-notes --title "NINJA $TAG"
          fi
          gh release upload "$TAG" out/NINJA-*.apk --clobber --repo "$GITHUB_REPOSITORY"
          echo "APK attached to release $TAG"

  web:
    # Deploy the web build to GitHub Pages (gh-pages branch) on every push to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
