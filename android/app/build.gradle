apply plugin: 'com.android.application'

// ─────────────────────────────────────────────────────────────────────────────
// Version auto-sync (fixes drift between GitHub release and Android build)
// versionName/versionCode always derive from package.json in the repo root,
// so the Android build can never fall behind the published release.
// versionCode scheme: major*10000 + minor*100 + patch  →  1.2.1 = 10201
// Bump package.json version for every new release; versionCode rises with it.
// ─────────────────────────────────────────────────────────────────────────────
def pkgVersion = { ->
    try {
        def pkgFile = file('../../package.json')
        def pkg = new groovy.json.JsonSlurper().parseText(pkgFile.text)
        return pkg.version.toString()
    } catch (Exception ignored) {
        return '1.2.1'
    }
}
def computeVersionCode = { String v ->
    def p = v.tokenize('.')
    if (p.size() >= 3) {
        try {
            return (p[0] as int) * 10000 + (p[1] as int) * 100 + (p[2] as int)
        } catch (Exception ignored) {}
    }
    return 10201
}

// ─────────────────────────────────────────────────────────────────────────────
// Release signing — CI injects the keystore via repo secrets:
//   NINJA_KEYSTORE_BASE64, NINJA_STORE_PASSWORD, NINJA_KEY_ALIAS, NINJA_KEY_PASSWORD
// The workflow decodes the base64 keystore to android/app/ninja.keystore.
// Locally (no keystore present) release builds fall back to debug signing,
// so ./gradlew assembleRelease never fails on a dev machine.
// ─────────────────────────────────────────────────────────────────────────────
def keystoreFile = file('ninja.keystore')
def ksStorePassword = System.getenv('NINJA_STORE_PASSWORD')
def ksKeyAlias = System.getenv('NINJA_KEY_ALIAS')
def ksKeyPassword = System.getenv('NINJA_KEY_PASSWORD')
def keystoreBase64 = System.getenv('NINJA_KEYSTORE_BASE64')
def releaseSigningConfigured = keystoreFile.isFile() &&
        (keystoreBase64 != null && !keystoreBase64.trim().isEmpty()) &&
        [ksStorePassword, ksKeyAlias, ksKeyPassword].every { it != null && !it.trim().isEmpty() }

android {
    namespace "ir.matin.ninjaarashi2"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ir.matin.ninjaarashi2"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode computeVersionCode(pkgVersion())
        versionName pkgVersion()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            storeFile keystoreFile
            storePassword ksStorePassword
            keyAlias ksKeyAlias
            keyPassword ksKeyPassword
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig releaseSigningConfigured ? signingConfigs.release : signingConfigs.debug
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
